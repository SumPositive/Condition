<?xml version="1.0" encoding="UTF-8"?>
<!-- Condition / 体調メモ (Vitalin) App Icon source -->
<!-- 案B ゴールド: ハート先端が水面に触れ、同心楕円の波紋が斜め見下ろしで広がる -->
<!-- 1024x1024。iOSが角丸マスクを行うため背景は正方形いっぱいに塗る -->
<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="82%">
      <stop offset="0%"   stop-color="#b85350"/>
      <stop offset="52%"  stop-color="#9e3d3b"/>
      <stop offset="100%" stop-color="#7f2f2d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#efd89a"/>
      <stop offset="55%"  stop-color="#e0c179"/>
      <stop offset="100%" stop-color="#cfa94f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 水面の波紋（同心楕円・斜め見下ろし・外側ほど薄い） -->
  <ellipse cx="512" cy="650.8" rx="92" ry="27.6" fill="none" stroke="url(#gold)" stroke-width="34" opacity="1"/>
  <ellipse cx="512" cy="650.8" rx="210" ry="63.0" fill="none" stroke="url(#gold)" stroke-width="26" opacity="0.82"/>
  <ellipse cx="512" cy="650.8" rx="330" ry="99.0" fill="none" stroke="url(#gold)" stroke-width="20" opacity="0.64"/>
  <ellipse cx="512" cy="650.8" rx="452" ry="135.6" fill="none" stroke="url(#gold)" stroke-width="15" opacity="0.48"/>
  <ellipse cx="512" cy="650.8" rx="560" ry="168.0" fill="none" stroke="url(#gold)" stroke-width="11" opacity="0.34"/>

  <!-- ハート -->
  <path d="M50 88 C 20 66, 4 48, 4 30 C 4 14, 16 4, 30 4 C 40 4, 47 10, 50 18 C 53 10, 60 4, 70 4 C 84 4, 96 14, 96 30 C 96 48, 80 66, 50 88 Z" transform="translate(232 128) scale(5.6)" fill="url(#gold)"/>
</svg>
